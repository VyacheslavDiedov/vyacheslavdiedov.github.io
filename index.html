<!doctype html>
<html><head><meta charset="utf-8"><title>Ads Tool</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:sans-serif;max-width:640px;margin:60px auto;padding:0 16px}
code{display:block;background:#f2f2f2;padding:12px;word-break:break-all}</style></head>
<body>
<h1>Ads Tool</h1>
<p>Internal tool for managing our own advertising accounts.</p>
<div id="r"></div>
<script>
const c=new URLSearchParams(location.search).get('auth_code');
if(c)document.getElementById('r').innerHTML='<h3>auth_code:</h3><code>'+c.replace(/[<>&"]/g,'')+'</code><p>Скопіюй код. Він дійсний приблизно 1 годину.</p>';
</script>
</body></html>
